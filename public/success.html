<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Confirmed — Mystic Seoul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="/"><span class="dot">M</span> Mystic Seoul</a>
      <div class="nav-cta">
        <div class="lang-toggle" id="langToggle">
          <button class="lang-toggle-btn" id="langToggleBtn" type="button" aria-haspopup="true" aria-expanded="false">
            <span id="langToggleLabel">한국어</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="lang-menu" id="langMenu" role="menu" hidden>
            <button class="lang-opt" type="button" data-lang="ko" role="menuitem">한국어</button>
            <button class="lang-opt" type="button" data-lang="en" role="menuitem">English</button>
            <button class="lang-opt" type="button" data-lang="zh" role="menuitem">中文</button>
            <button class="lang-opt" type="button" data-lang="ja" role="menuitem">日本語</button>
            <button class="lang-opt" type="button" data-lang="fr" role="menuitem">Français</button>
          </div>
        </div>
        <a class="btn btn-ghost" href="/" data-i18n="nav.home">← Home</a>
      </div>
    </div>
  </header>

  <main class="result-wrap">
    <div class="result-icon ok">✓</div>
    <h1 data-i18n="success.title">Your seat is reserved</h1>
    <p id="resultMsg" data-i18n="success.msg">Thank you — your booking is confirmed. A confirmation email with the meeting location and full details is on its way.</p>
    <div class="receipt" id="receipt" style="display:none"></div>
    <a class="btn btn-buy" href="/booking.html" data-i18n="success.bookAnother">Book another experience</a>
  </main>

  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <script>
    var KRW = function (n) { return '₩' + Number(n).toLocaleString('en-US'); };
    var params = new URLSearchParams(location.search);
    var bookingId = params.get('booking');
    var bookingData = null;

    function loc() { return (window.MSi18n && window.MSi18n.locale()) || 'en-US'; }
    function tr(k) { return (window.t ? window.t(k) : k); }

    function renderReceipt() {
      if (!bookingData) return;
      var b = bookingData;
      var d = new Date(b.date + 'T00:00:00');
      var day = d.toLocaleDateString(loc(), { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' });
      var hm = b.slot.split(':').map(Number);
      var td = new Date(); td.setHours(hm[0], hm[1], 0, 0);
      var time = td.toLocaleTimeString(loc(), { hour: 'numeric', minute: '2-digit' });
      var r = document.getElementById('receipt');
      r.style.display = 'block';
      r.innerHTML =
        '<div class="row"><span class="k">' + tr('success.rExperience') + '</span><span class="v">' + b.package + '</span></div>' +
        '<div class="row"><span class="k">' + tr('success.rDate') + '</span><span class="v">' + day + '</span></div>' +
        '<div class="row"><span class="k">' + tr('success.rTime') + '</span><span class="v">' + time + '</span></div>' +
        '<div class="row"><span class="k">' + tr('success.rGuests') + '</span><span class="v">' + b.quantity + '</span></div>' +
        '<div class="row"><span class="k">' + tr('success.rTotal') + '</span><span class="v">' + KRW(b.amount) + '</span></div>' +
        '<div class="row"><span class="k">' + tr('success.rBooking') + '</span><span class="v">MS-' + String(b.id).padStart(4, '0') + '</span></div>';
    }

    if (bookingId) {
      fetch('/api/booking/' + bookingId)
        .then(function (r) { return r.json(); })
        .then(function (b) { if (b && !b.error) { bookingData = b; renderReceipt(); } })
        .catch(function () {});
    }
    if (params.get('demo')) {
      document.getElementById('resultMsg').setAttribute('data-i18n', 'success.demoMsg');
      document.getElementById('resultMsg').innerHTML = tr('success.demoMsg');
    }
    document.addEventListener('i18n:changed', renderReceipt);
  </script>
</body>
</html>
